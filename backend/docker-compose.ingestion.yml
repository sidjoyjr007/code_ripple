version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: rippleagent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: rippleagent_embedding_engine
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Note: To use GPU acceleration for embeddings, you'd add deploy -> resources -> reservations -> devices here
    
volumes:
  redis_data:
  ollama_data:
